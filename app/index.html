<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Sticky Notes</title>
  <meta name="description" content="Simple sticky notes: four colors, an optional checklist, up to three notes that stay put until you delete them.">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="demo">
  <main id="desk" class="desk" aria-label="Sticky notes"></main>
  <div id="empty" class="empty" hidden>
    <p>No notes. Deleted notes are gone for good.</p>
    <button id="firstNote" class="first-note" type="button">+ New sticky note</button>
  </div>
  <footer class="corner">
    <span><img src="icon.png" alt="" width="18" height="18"> Sticky Notes · browser demo</span>
    <a class="get-app" href="https://github.com/TheoYanvno/sticky-notes/releases/latest/download/Sticky-Notes-Setup.exe">⬇ Get the Windows app</a>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
