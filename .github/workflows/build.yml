name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build the installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # unsigned build (no code-signing certificate)
      - uses: actions/upload-artifact@v4
        with:
          name: Sticky-Notes-Setup
          path: dist/*.exe
          if-no-files-found: error
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --title "Sticky Notes $GITHUB_REF_NAME" --generate-notes
