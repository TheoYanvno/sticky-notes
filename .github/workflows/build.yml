name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build the installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # unsigned build (no code-signing certificate)
      - uses: actions/upload-artifact@v4
        with:
          name: Sticky-Notes-Setup
          path: dist/*.exe
          if-no-files-found: error
      - name: Publish the installer as a GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # One release per version in package.json; later pushes of the same version replace the installer,
          # so releases/latest/download/Sticky-Notes-Setup.exe always serves the newest build.
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/Sticky-Notes-Setup.exe --clobber
          else
            gh release create "$tag" dist/Sticky-Notes-Setup.exe --target "$GITHUB_SHA" --title "Sticky Notes $tag" --notes "Windows installer: download **Sticky-Notes-Setup.exe**, run it and pick where to install. The installer isn't code-signed yet, so Windows SmartScreen may ask you to confirm: choose **More info → Run anyway**."
          fi
