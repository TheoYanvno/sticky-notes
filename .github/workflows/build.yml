name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # The real desktop app, started under a virtual screen and clicked through (test/smoke/electron-smoke.mjs)
  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: xvfb-run -a npx electron --no-sandbox test/smoke/electron-smoke.mjs

  windows:
    needs: [test, smoke]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build the installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # unsigned build (no code-signing certificate)
      - uses: actions/upload-artifact@v4
        with:
          name: Sticky-Notes-Setup
          path: dist/*.exe
          if-no-files-found: error
      - name: Publish the installer as a GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # One release per version in package.json. A version that's already released is left alone, so
          # work in progress never replaces the installer people download; bump the version to publish.
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released; not replacing it"
          else
            gh release create "$tag" dist/Sticky-Notes-Setup.exe --target "$GITHUB_SHA" --title "Sticky Notes $tag" --notes-file .github/release-notes.md
          fi
